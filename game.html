<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бой - PVP PROJECT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div class="container game-container">
        <header>
            <div class="logo">
                <span class="logo-icon">⚔</span>
                <span class="logo-text">БОЙ</span>
            </div>
            <div class="game-info">
                <span id="gameCode" class="code-badge">----</span>
                <span id="gameStatus" class="status-badge">ОЖИДАНИЕ</span>
            </div>
        </header>

        <main class="game-main">
            <!-- Лобби -->
            <div class="screen" id="game-lobby">
                <h1>ЛОББИ</h1>
                <div class="players-list" id="playersList"></div>
                <button class="btn primary" id="readyBtn" onclick="toggleReady()">✅ ГОТОВО</button>
            </div>

            <!-- Бой -->
            <div class="screen hidden" id="game-battle">
                <div class="battle-layout">
                    <canvas id="battleCanvas"></canvas>

                    <!-- ОРУЖИЕ ВНИЗУ (2 СЛОТА) -->
                    <div class="weapon-bar">
                        <div class="weapon-slot" id="weaponSlot0" onclick="selectWeapon(0)">
                            <svg class="weapon-svg" viewBox="0 0 100 40" preserveAspectRatio="xMidYMid meet">
                                <!-- ПУСТОЙ СЛОТ -->
                            </svg>
                            <span class="weapon-label">СЛОТ 1</span>
                        </div>
                        <div class="weapon-slot" id="weaponSlot1" onclick="selectWeapon(1)">
                            <svg class="weapon-svg" viewBox="0 0 100 40" preserveAspectRatio="xMidYMid meet">
                                <!-- ПУСТОЙ СЛОТ -->
                            </svg>
                            <span class="weapon-label">СЛОТ 2</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
